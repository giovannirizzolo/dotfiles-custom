# vim: ft=tmux
# Statusline TEMPLATE — colors come from the active Ghostty theme.
# ghostty-theme.sh fills the @@-wrapped role placeholders and writes
# statusline.theme.conf (gitignored), then sources it. Roles:
#   BG/FG/SEL      Ghostty background / foreground / selection-background
#   ACCENT         Ghostty cursor-color (main highlight)
#   ACCENT2        palette 1, or palette 5 if that equals ACCENT
#   C0..C15        the 16 ANSI palette colors   DIM  between C8 and C7
set -g mode-style "fg=@@C15@@,bg=@@SEL@@"

set -g message-style "fg=@@ACCENT@@,bg=@@C0@@"
set -g message-command-style "fg=@@ACCENT@@,bg=@@C0@@"

set -g pane-border-style "fg=@@C0@@"
set -g pane-active-border-style "fg=@@ACCENT2@@"

# Transparent status bar: "default" = Ghostty's own background (opacity + blur included)
set -as terminal-features ",xterm-ghostty:RGB"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=@@C8@@,bg=default"

set -g status-bg default

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=@@BG@@,bg=@@ACCENT@@,bold] #S:#I.#P #[fg=@@ACCENT@@,bg=@@C4@@,nobold,nounderscore,noitalics]#[fg=@@C15@@,bg=@@C4@@,bold] #(whoami) #[fg=@@C4@@,bg=default]"
set -g status-right "#[fg=@@SEL@@,bg=default,nobold,nounderscore,noitalics]#[fg=@@ACCENT2@@,bg=@@SEL@@]#[fg=@@C3@@,bg=@@ACCENT2@@]#[fg=@@BG@@,bg=@@C3@@,bold] #(fish --no-config ~/.config/tmux/next_trip/next_trip_countdown.fish)"

setw -g window-status-activity-style "underscore,fg=@@C3@@,bg=default"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=@@DIM@@,bg=default"
setw -g window-status-format '#[bg=default] #[default] #I  #{b:window_name} #[bg=default,nobold,nounderscore,noitalics] '
setw -g window-status-current-format '#[fg=@@ACCENT@@,bg=default,reverse]#[noreverse,fg=@@BG@@,bg=@@ACCENT@@,bold] #I #[fg=@@ACCENT@@,bg=@@ACCENT2@@]#[fg=@@C15@@] #{b:window_name} #[fg=@@ACCENT2@@,bg=default,nobold]'

# ── tmux's built-in UI (otherwise grey "theme*" defaults) ──────────────
# choose-tree / prefix s, prefix w: preview boxes, active preview label
set -g tree-mode-border-style "fg=@@ACCENT2@@,bg=default"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#@@ACCENT@@,#@@C4@@}"  # ## = literal # inside a format
# menus (prefix <, >, right-click) and popups
set -g menu-style "fg=@@FG@@,bg=@@C0@@"
set -g menu-selected-style "fg=@@BG@@,bg=@@ACCENT@@"
set -g menu-border-style "fg=@@ACCENT2@@,bg=@@C0@@"
set -g popup-style "fg=@@FG@@,bg=@@C0@@"
set -g popup-border-style "fg=@@ACCENT2@@,bg=@@C0@@"
# prefix q pane numbers
set -g display-panes-border-style "fg=@@ACCENT2@@,bg=default"
set -g display-panes-colour "@@C4@@"
set -g display-panes-active-colour "@@ACCENT@@"
# copy-mode search
set -g copy-mode-match-style "fg=@@BG@@,bg=@@C6@@"
set -g copy-mode-current-match-style "fg=@@BG@@,bg=@@ACCENT@@"
set -g copy-mode-mark-style "fg=@@BG@@,bg=@@C3@@"
setw -g clock-mode-colour "@@ACCENT@@"
