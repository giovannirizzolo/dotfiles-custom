<!doctype html>
<!-- Renders gta-vi-logo.svg to gta-vi-bg.png (see themes/GTA VI). -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 3200px; height: 2000px; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  img {
    height: 600px;  /* logo = 30% of the canvas height */
    /* Subtle hot-pink (#FF2B90) neon glow: tight halo + wide bloom. */
    filter: blur(7px)  /* soft-focus so text on top stays readable */
            drop-shadow(0 0 18px rgba(255, 43, 144, 0.45))
            drop-shadow(0 0 70px rgba(255, 43, 144, 0.30))
            drop-shadow(0 0 160px rgba(255, 43, 144, 0.18));
  }
</style></head>
<body><img src="gta-vi-logo.svg" alt=""></body></html>
